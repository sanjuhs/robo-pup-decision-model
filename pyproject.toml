[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robopup-arena"
version = "0.1.0"
description = "An interactive MuJoCo robot pet lab with reproducible residual PPO experiments"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "mujoco==3.3.7",
  "gymnasium==1.2.2",
  "stable-baselines3==2.7.0",
  "torch==2.9.0",
  "numpy==2.3.4",
  "fastapi==0.119.0",
  "uvicorn[standard]==0.37.0",
  "pydantic==2.12.2",
  "pillow==12.3.0",
  "pocketsphinx==5.0.4",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.14.0"]
mjx = ["mujoco-mjx==3.3.7", "jax==0.7.2"]
cuda = ["jax[cuda12]==0.7.2"]

[project.scripts]
robopup-train = "robopup.train:main"
robopup-evaluate = "robopup.evaluate:main"
robopup-benchmark = "robopup.benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/robopup"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
