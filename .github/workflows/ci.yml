name: Prototype checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'web/**', 'scripts/**', 'pyproject.toml', 'uv.lock', '.github/workflows/ci.yml']
  pull_request:
permissions:
  contents: read
jobs:
  native-arena:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_public_secrets.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: ROBOPUP_MJX=1 bash scripts/setup.sh
      - run: uv run --frozen --extra dev --extra mjx ruff check src scripts tests
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            web/test-results
            artifacts/screens
